<div class="auth-container container">
  <div class="glass-card auth-card">
    <h2 class="hero-title auth-title gradient-text">Welcome Back</h2>
    <p class="auth-subtitle">Login to manage your links</p>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="input-field" [(ngModel)]="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="input-field" [(ngModel)]="password" name="password" required>
      </div>
      <button type="submit" class="btn-primary w-full" [disabled]="isLoading">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
      <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>
    </form>
    
    <div class="auth-footer">
      Don't have an account? <a routerLink="/register">Sign up</a>
    </div>
  </div>
</div>
