<div class="auth-container container">
  <div class="glass-card auth-card">
    <h2 class="hero-title auth-title gradient-text">Get Started</h2>
    <p class="auth-subtitle">Create an account to shorten URLs</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="input-field" formControlName="email" autocomplete="username">
        <div class="error-msg" *ngIf="email?.touched && email?.invalid">
          <span *ngIf="email?.errors?.['required']">Email is required.</span>
          <span *ngIf="email?.errors?.['email']">Enter a valid email address.</span>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="input-field" formControlName="password" autocomplete="new-password">
        <div class="error-msg" *ngIf="password?.touched && password?.invalid">
          <span *ngIf="password?.errors?.['required']">Password is required.</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters.</span>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" class="input-field" formControlName="confirmPassword" autocomplete="new-password">
        <div class="error-msg" *ngIf="confirmPassword?.touched && confirmPassword?.invalid">
          <span *ngIf="confirmPassword?.errors?.['required']">Confirm password is required.</span>
        </div>
        <div class="error-msg" *ngIf="registerForm.errors?.['passwordsMismatch'] && (confirmPassword?.touched || password?.touched)">
          <span>Passwords do not match.</span>
        </div>
      </div>
      <button type="submit" class="btn-primary w-full" [disabled]="isLoading || registerForm.invalid">
        {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
      </button>
      <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>
      <p class="success-msg" *ngIf="successMsg">{{ successMsg }}</p>
    </form>
    
    <div class="auth-footer">
      Already have an account? <a routerLink="/login">Login</a>
    </div>
  </div>
</div>
